name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install

      # v2: headroom's real SmartCrusher/TOIN algorithm (native/headroom-core/,
      # forked and feature-stripped from vendor/headroom) is compiled to
      # WebAssembly and the output IS committed (native/headroom-wasm/pkg/ —
      # same reasoning as plugin/dist/, since a plugin install never runs
      # cargo/wasm-pack). Rebuilding it here anyway, before running tests
      # against it, proves the Rust source still actually builds — a
      # committed-but-stale artifact would otherwise mask a real regression
      # in native/headroom-core/ that nobody happened to rebuild+recommit for.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Prebuilt binary, not `cargo install wasm-pack` (which compiles from
      # source and takes several minutes even on a fast machine — confirmed
      # directly on the dev machine this was first built on).
      - uses: taiki-e/install-action@wasm-pack
      - run: npm run build:wasm

      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Proves the plugin still starts with zero node_modules present — the
      # exact shape of a real marketplace install (see
      # src/plugin-install.itest.ts's header for why this is a separate,
      # slower check from `npm test` rather than folded into it).
      - run: npm run test:plugin-install
      # The live MCP-compression proof (`npm run test:mcp-e2e`) is NOT run
      # here: it spawns a real `claude -p` session, which needs credentials CI
      # does not have. It skips cleanly when the CLI is absent, so it is safe
      # to add once an authenticated runner exists. Until then it is a
      # pre-push check — see README.

  # Both of this plugin's real users run Windows, and one shipped bug (the
  # CRLF wrapped-signature failure in CodeCompressor) was Windows-specific
  # while every CI job ran Ubuntu. This runs the SHIPPED tree standalone on
  # windows-latest — no npm install, exactly like a marketplace install — and
  # drives the pretooluse hook over stdin the way Claude Code does, asserting
  # compression actually produces a substitute. That last step is the one
  # that would have caught the CRLF bug.
  install-on-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the CLI and MCP server from an isolated copy of plugin/
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -r plugin "$TMP/plugin"
          cd "$TMP"
          node "$TMP/plugin/bin/optiflow" --version
          node "$TMP/plugin/bin/optiflow" doctor
      - name: Compression produces a substitute on Windows (CRLF regression gate)
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -r plugin "$TMP/plugin"
          cd "$TMP"
          # A large TS file written with CRLF line endings, the case the
          # wrapped-signature bug shipped on.
          node -e "
            const lines = ['import fs from \"node:fs\";'];
            for (let i = 0; i < 120; i++) {
              lines.push('export function fn' + i + '(a: number, b: number): number {');
              lines.push('  const c = a * b;');
              lines.push('  const d = c + a;');
              lines.push('  const e = d - b;');
              lines.push('  const f = e * 2;');
              lines.push('  return f;');
              lines.push('}');
            }
            require('fs').writeFileSync('big.ts', lines.join('\r\n'));
          "
          node -e "
            const { execFileSync } = require('child_process');
            const path = require('path');
            const payload = JSON.stringify({
              session_id: 'ci-windows', cwd: process.cwd(),
              hook_event_name: 'PreToolUse', tool_name: 'Read',
              tool_input: { file_path: path.resolve('big.ts') },
            });
            const out = execFileSync(process.execPath,
              [path.resolve('plugin/hooks/pretooluse-optimizer.mjs')],
              { input: payload, encoding: 'utf8',
                env: { ...process.env,
                  OPTIFLOW_HOME: path.resolve('of-home'),
                  TOKEN_OPTIMIZER_STATE_DIR: path.resolve('of-state'),
                  TOKEN_OPTIMIZER_MCP_CAPABILITIES: 'smart_read' } });
            const o = JSON.parse(out).hookSpecificOutput || {};
            if (o.permissionDecision !== 'deny') throw new Error('expected deny, got ' + o.permissionDecision);
            const sub = String(o.additionalContext || '');
            if (!sub.includes('lines omitted')) throw new Error('no elisions — compression silently failed open on Windows');
            if (!sub.includes('export function fn0(')) throw new Error('signature missing from substitute');
            console.log('Windows compression OK: substitute ' + sub.length + ' chars');
          "

  # The OTHER install path the README documents: `npm install -g
  # github:kristijankopacevic/optiflow-mcp`, for running the `optiflow` CLI
  # from a normal terminal rather than through the plugin.
  #
  # This was broken and nobody noticed, because nothing ever exercised it: with
  # every build-time package sitting in `dependencies` and no `files` field,
  # npm packed the whole repo and then tried to build @huggingface/transformers'
  # native tree (onnxruntime-node, onnxruntime-web, sharp). A real user hit
  # `spawn sh ENOENT` on sharp and got no CLI at all.
  #
  # Nothing in `dependencies` was ever needed to RUN the shipped tree -- esbuild
  # either bundles it or lists it in `nativeExternals` (lazily required, absent
  # by design in a real install), which the job below already proves. So this
  # asserts the honest packaging: a dependency-free install that still runs.
  pack-and-install-the-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Pack, install into an isolated prefix, and run the CLI
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          mv "$TARBALL" "$TMP/"
          cd "$TMP"
          npm install --prefix "$TMP/pfx" "$TMP/$TARBALL"
          # Must pull in NOTHING but optiflow-mcp itself. A second entry here
          # means a runtime dependency crept back into package.json.
          installed="$(ls "$TMP/pfx/node_modules")"
          if [ "$installed" != "optiflow-mcp" ]; then
            echo "FAILED: expected only optiflow-mcp, got:"; echo "$installed"; exit 1
          fi
          BIN="$TMP/pfx/node_modules/optiflow-mcp/plugin/bin/optiflow"
          node "$BIN" --version
          node "$BIN" doctor

  # A marketplace install ships no node_modules and Claude Code's automatic
  # dependency install runs with --ignore-scripts, so the plugin must run on
  # whatever Node the host already has. Ubuntu LTS still ships Node 18, and a
  # real user hit exactly that: the plugin crashed there while CI (Node 22)
  # stayed green. This job pins the floor declared in package.json engines.
  install-on-oldest-supported-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Deliberately NOT `npm ci` — this job must prove the SHIPPED plugin/
      # tree runs standalone, with no dependency tree at all.
      - name: Run the CLI from an isolated copy of plugin/
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -r plugin "$TMP/plugin"
          test -x "$TMP/plugin/bin/optiflow" || { echo "bin/optiflow is not executable"; exit 1; }
          cd "$TMP"
          node "$TMP/plugin/bin/optiflow" --version
          node "$TMP/plugin/bin/optiflow" doctor
      - name: Start the MCP server from the isolated copy
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -r plugin "$TMP/plugin"
          cd "$TMP"
          # Must not exit non-zero on import; a clean stdio wait is success.
          timeout 10s node "$TMP/plugin/dist/optimizer/server.js" < /dev/null > out.log 2>&1 || code=$?
          if grep -qiE "ERR_MODULE_NOT_FOUND|Cannot use import statement|SyntaxError" out.log; then
            echo "FAILED: server crashed at import on Node ${{ matrix.node }}"; cat out.log; exit 1
          fi
          echo "server started cleanly on Node ${{ matrix.node }}"
