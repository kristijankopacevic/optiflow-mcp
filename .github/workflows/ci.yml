name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both upstream projects are vendored as provenance-only git
          # submodules (see docs/architecture.md) — needed for
          # scripts/verify-upstream-invariants.mjs below.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Module 1's chop hook shares the Bash PreToolUse event with
      # vendor/token-optimizer-mcp's own hook; this fails the build the
      # moment that upstream invariant stops holding (plan Risk R9).
      - run: npm run verify-upstream
